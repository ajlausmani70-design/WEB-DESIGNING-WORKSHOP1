<! DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOTEL ROOM BOOKING FORM </title>
</head><div align="center">
<body>
<h1 align="center">HOTEL ROOM BOOKING FORM</h1>
<hr></hr>
<form action="booking.p" align="center" >
<label for=" Full Name">Full Name:</label>
<input type="text" name="Full Name" id="Full Name" required>
<br></br>
<label for="Email">Email:</label>
<input type="email" name="Email" id="Email" required>
<label for="Phone"> Phone</label>
<input type="tel" name="Phone" id="Phone">
<br></br>
<label for="Check-in Date">Check-in Date:</label>
<input type="date" name="Check-in Date" id="Check-in Date" required>
<br></br>
<label for="Check-out Date">Check-out Date:</label>
<input type="date" name="Check-out Date" id="Check-out Date" required>
<br></br>
<label for="Room Type">Room Type:</label>
<select name="Room Type" id="Room Type" required>
    <option value="Single">Single</option>
    <option value="Double">Double</option>
    <option value="Deluxe">Deluxe</option>
    <option value="Suite">Suite</option>
</select>
<br></br>
<label for="Number of Guests">Number of Guests:</label>
<input type="number" name="Number of Guests" id="Number of Guests" min="1" max="4" required>
<br></br>
<label for="Special Requests">Special Requests:</label>
<textarea name="Special Requests" id="Special Requests" rows="4" cols="50"></textarea>
<br></br>
<button type="reset">Reset</button>
<input type="submit" value="Submit">
</form>
<br></br>
<hr></hr>
<footer align="center">
    <p>&copy; 2026 Hotel Booking. All rights reserved.</p>
</footer>
</div>
</body>
</html>
